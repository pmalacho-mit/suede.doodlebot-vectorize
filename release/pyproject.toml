[build-system]
requires = ["maturin>=1.4,<2"]
build-backend = "maturin"

[project]
name = "arcline-vectorize"
dynamic = ["version"]   # taken from Cargo.toml
description = "Rust port of arc_line_vectorization_suede (image -> robot arc/line commands)"
requires-python = ">=3.9"

[tool.maturin]
features = ["python"]
module-name = "arcline_vectorize"
# suede machinery is not part of the Python package
exclude = [{ path = ".github/**/*", format = "sdist" }, { path = ".suede/**/*", format = "sdist" }, { path = ".gitrepo", format = "sdist" }]
